[project]
name = "extended_openai_conversation"
description = "Extended OpenAI Conversation custom component for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "types-PyYAML",
    "pytest",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-homeassistant-custom-component>=0.13.0",
]

[tool.ruff]
target-version = "py314"
extend-include = ["custom_components/extended_openai_conversation/**/*.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",  # line too long
    "B008",  # function call in argument default (probatio/voluptuous pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.extended_openai_conversation", "homeassistant"]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
probatio = "vol"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.util.dt" = "dt_util"

[tool.pytest.ini_options]
# HA core (2026.11+) aliases httpx to httpx2 in homeassistant/__init__.py and
# raises if httpx was already imported. pytest-homeassistant-custom-component's
# plugin imports respx (which imports httpx) before it imports homeassistant, so
# early-load a homeassistant module to run the alias first. Not `-p
# homeassistant`: that's the PHCC plugin's own entry-point name. Can likely be
# dropped once PHCC is regenerated from a 2026.11 HA release.
addopts = "-p homeassistant.const"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
files = ["custom_components/extended_openai_conversation/**/*.py"]
exclude = ["tests/"]
